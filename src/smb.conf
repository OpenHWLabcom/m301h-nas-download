# OpenHW Lab · Samba 配置（家庭网盘）→ /root/smb.conf
# 手机/电脑/盒子访问  \\<盒子IP>\nas
[global]
   workgroup = WORKGROUP
   server string = OpenHW Lab NAS
   netbios name = OPENHWLAB
   security = user
   map to guest = Bad User
   guest account = root
   min protocol = SMB2
   # 老盒子内存小：关一些花哨特性
   load printers = no
   printing = bsd
   disable spoolss = yes

[nas]
   comment = 家庭网盘
   path = /root/nas
   browseable = yes
   writable = yes
   guest ok = yes
   force user = root
   create mask = 0664
   directory mask = 0775
   # 允许浏览下载目录
   read only = no
