# OpenHW Lab · aria2 配置（下载机）→ /root/aria2.conf
continue=true
max-concurrent-downloads=5
max-connection-per-server=8
split=8
min-split-size=1M
disk-cache=16M
file-allocation=none
# 下载落盘目录（NAS 根下的 downloads）
dir=/root/nas/downloads
input-file=/root/aria2.session
save-session=/root/aria2.session
save-session-interval=30
# RPC
enable-rpc=true
rpc-allow-origin-all=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-secret=openhwlab
# BT
follow-torrent=true
enable-dht=true
bt-enable-lpd=true
enable-peer-exchange=true
seed-time=0
bt-max-peers=55
# 日志 / 单文件上限
log=/root/aria2.log
log-level=warn
